# Used by Vercel (GitHub deploy). Local / Docker installs use backend/requirements.txt.
[project]
name = "hayat-hrms"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "motor>=3.3",
    "pymongo>=4.6",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "requests>=2.31",
    "reportlab>=4.0",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
]

[tool.vercel]
entrypoint = "backend.server:app"
